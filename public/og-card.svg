<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Georgia, 'Source Serif 4', 'Noto Serif CJK SC', serif">
  <!-- 暖纸底 -->
  <rect width="1200" height="630" fill="#faf8f3"/>
  <!-- 极淡坐标纸网格 -->
  <g stroke="rgba(58,84,132,0.05)" stroke-width="1">
    <!-- 竖线，每 40px -->
    <path d="M40 0 V630 M80 0 V630 M120 0 V630 M160 0 V630 M200 0 V630 M240 0 V630 M280 0 V630 M320 0 V630 M360 0 V630 M400 0 V630 M440 0 V630 M480 0 V630 M520 0 V630 M560 0 V630 M600 0 V630 M640 0 V630 M680 0 V630 M720 0 V630 M760 0 V630 M800 0 V630 M840 0 V630 M880 0 V630 M920 0 V630 M960 0 V630 M1000 0 V630 M1040 0 V630 M1080 0 V630 M1120 0 V630 M1160 0 V630"/>
    <!-- 横线，每 40px -->
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200 M0 320 H1200 M0 360 H1200 M0 400 H1200 M0 440 H1200 M0 480 H1200 M0 520 H1200 M0 560 H1200 M0 600 H1200"/>
  </g>

  <!-- 左上品牌 -->
  <text x="96" y="118" font-family="'Inter', 'Noto Sans CJK SC', sans-serif" font-size="26" font-weight="600" fill="#1a1814" letter-spacing="-0.5">FHR&#8217;s Blog</text>
  <!-- 品牌下橙色短线 -->
  <rect x="96" y="138" width="56" height="4" rx="2" fill="#ff5e00"/>

  <!-- 主标题 -->
  <text x="96" y="318" font-family="'Inter', 'Noto Sans CJK SC', sans-serif" font-size="78" font-weight="700" fill="#1a1814" letter-spacing="-1.5">物理文献的总结</text>
  <text x="96" y="404" font-family="'Inter', 'Noto Sans CJK SC', sans-serif" font-size="78" font-weight="700" fill="#1a1814" letter-spacing="-1.5">与个人想法的记录</text>

  <!-- 副标语 -->
  <text x="96" y="486" font-family="Georgia, 'Source Serif 4', 'Noto Serif CJK SC', serif" font-size="30" fill="#55504a">把读过的物理文献用自己的话重写一遍。</text>

  <!-- 底部分隔线 + 域名 -->
  <line x1="96" y1="556" x2="1104" y2="556" stroke="#e3ddd2" stroke-width="1.5"/>
  <text x="96" y="596" font-family="'JetBrains Mono', monospace" font-size="24" fill="#8a847c">hrfeng.uno</text>
  <text x="1104" y="596" text-anchor="end" font-family="'Inter', sans-serif" font-size="22" fill="#8a847c">Astro · KaTeX · 静态生成</text>
</svg>
