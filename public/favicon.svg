<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 暖纸底圆角方块，与站点配色一致 -->
  <rect width="64" height="64" rx="14" fill="#faf8f3"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="#e3ddd2" stroke-width="1.5"/>
  <!-- 衬线 F，呼应正文衬线字体 -->
  <text x="32" y="44" text-anchor="middle" font-family="Georgia, 'Source Serif 4', serif" font-size="38" font-weight="600" fill="#1a1814">F</text>
  <!-- 橙色强调点，呼应品牌色 -->
  <circle cx="48" cy="44" r="4" fill="#ff5e00"/>
</svg>
